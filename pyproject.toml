[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ride-app"
version = "0.1.0"
description = "Ride-hailing backend with a shared Python core, CLI, and HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128,<0.129",
    "pydantic>=2.12,<3",
    "uvicorn>=0.39,<0.40",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
ride-app = "ride_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
